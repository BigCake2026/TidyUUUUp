name: Build Windows EXE

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release 版本号（例如 v1.0.9）'
        required: true
        default: 'v1.0.9'
      make_latest:
        description: '是否设为最新 Release'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  # 推送到 main 时自动触发
  push:
    branches:
      - main
    paths:
      - 'ui/**'
      - 'core/**'
      - 'main.py'
      - 'version.json'
      - 'requirements.txt'

jobs:
  build:
    name: 打包 Windows EXE
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        working-directory: v1.0.9
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: 读取版本号
        id: version
        working-directory: v1.0.9
        shell: bash
        run: |
          VERSION=$(python -c "import json; print(json.load(open('version.json',encoding='utf-8'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "已读取版本号: $VERSION"

      - name: 清理旧构建
        working-directory: v1.0.9
        shell: bash
        run: |
          rm -rf build dist release_v* TidyUUUUp.spec 2>/dev/null || true

      - name: PyInstaller 打包
        working-directory: v1.0.9
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "TidyUUUUp" `
            --icon "resources\app_icon.ico" `
            --clean `
            --noconfirm `
            --add-data "version.json;." `
            --add-data "resources;resources" `
            --hidden-import PyQt5 `
            --hidden-import watchdog `
            --hidden-import pynput `
            --hidden-import mss `
            --hidden-import send2trash `
            main.py

      - name: 验证 EXE 生成
        working-directory: v1.0.9
        shell: bash
        run: |
          if [ ! -f "dist/TidyUUUUp.exe" ]; then
            echo "::error::未找到 dist/TidyUUUUp.exe"
            exit 1
          fi
          ls -lh dist/TidyUUUUp.exe

      - name: 生成发布目录
        working-directory: v1.0.9
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p "release_v${VERSION}"
          cp "dist/TidyUUUUp.exe" "release_v${VERSION}/TidyUUUUp.exe"
          cp "version.json" "release_v${VERSION}/version.json"
          cp "requirements.txt" "release_v${VERSION}/requirements.txt"
          cat > "release_v${VERSION}/使用说明.txt" <<EOF
          ========================================
            TidyUUUUp v${VERSION}
          ========================================

          使用方法：
            1. 双击 TidyUUUUp.exe 即可运行
            2. 首次运行可能需要几秒启动时间

          系统要求：
            - Windows 10 / 11
            - 无需安装 Python

          自动更新：
            - 软件启动后会自动检查更新
            - 右键托盘图标 -> 检查更新 可手动检查

          构建信息：
            - 构建时间: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            - GitHub Run: ${{ github.run_id }}
          EOF

      - name: 压缩发布包
        working-directory: v1.0.9
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "release_v$VERSION\*" -DestinationPath "TidyUUUUp_v$VERSION.zip" -Force
          Write-Host "发布包已生成: TidyUUUUp_v$VERSION.zip"
          Get-ChildItem -Path "TidyUUUUp_v$VERSION.zip" | Format-List

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TidyUUUUp-windows-exe
          path: |
            v1.0.9/dist/TidyUUUUp.exe
            v1.0.9/TidyUUUUp_v*.zip
          retention-days: 30

      - name: 创建 GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: TidyUUUUp ${{ inputs.release_tag }}
          body: |
            # TidyUUUUp ${{ inputs.release_tag }}

            ## 📦 下载
            - **TidyUUUUp_v${{ steps.version.outputs.version }}.zip** — 完整发布包（含使用说明）
            - **TidyUUUUp.exe** — 单文件可执行程序

            ## 🚀 使用方法
            1. 下载 `TidyUUUUp_v${{ steps.version.outputs.version }}.zip` 并解压
            2. 双击 `TidyUUUUp.exe` 运行
            3. 首次启动可能需要几秒（解压依赖）

            ## 📋 系统要求
            - Windows 10 / 11 (64-bit)
            - 无需预装 Python

            ## 📝 变更日志
            - 重新建立 macOS 原生视觉设计系统
            - 极简浮动 Dock（半透明 + 柔和阴影）
            - Spotlight 风格搜索框
            - Empty State 简洁空状态
            - 围绕"扫描 → 查看 → 整理"核心动作设计

            ---
            构建时间: ${{ github.run_id }}
          files: |
            v1.0.9/TidyUUUUp_v*.zip
            v1.0.9/dist/TidyUUUUp.exe
          prerelease: false
          make_latest: ${{ inputs.make_latest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
