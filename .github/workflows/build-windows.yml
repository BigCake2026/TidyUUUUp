name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        default: v1.1.2
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install application and installer dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r v1.1.2/requirements.txt pyinstaller
          choco install innosetup --no-progress --yes

      - name: Build one-click Windows installer
        shell: pwsh
        run: python scripts/build_windows_release.py

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TidyUUUUp-v1.1.2-installer
          path: |
            release/TidyUUUUp_Setup_v1.1.2.exe
            release/TidyUUUUp_Setup_v1.1.2.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: TidyUUUUp ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/TidyUUUUp_Setup_v1.1.2.exe
            release/TidyUUUUp_Setup_v1.1.2.exe.sha256
