name: Build Windows release



on:

  workflow_dispatch:
  
    inputs:
    
      release_tag:
      
        description: Existing release tag to publish
        
        required: true
        
        default: v1.1.1
        
        type: string
        
  push:
  
    tags:
    
      - 'v*'
      


permissions:

  contents: write
  


jobs:

  build:
  
    runs-on: windows-latest
    


    steps:
    
      - name: Checkout source
      
        uses: actions/checkout@v4
        


      - name: Set up Python
      
        uses: actions/setup-python@v5
        
        with:
        
          python-version: '3.11'
          
          cache: pip
          


      - name: Install build dependencies
      
        shell: pwsh
        
        run: |
        
          python -m pip install --upgrade pip
          
          python -m pip install -r v1.1.1/requirements.txt pyinstaller
          


      - name: Build portable Windows package
      
        shell: pwsh
        
        run: python scripts/build_windows_release.py
        


      - name: Upload portable artifacts
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: TidyUUUUp-v1.1.1-Windows
          
          path: |
          
            dist/TidyUUUUp.exe
            
            release/*.zip
            
            release/*.sha256
            
          if-no-files-found: error
          


      - name: Publish GitHub release
      
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        
        uses: softprops/action-gh-release@v2
        
        with:
        
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          
          name: TidyUUUUp ${{ inputs.release_tag || github.ref_name }}
          
          generate_release_notes: true
          
          files: |
          
            release/*.zip
            
            release/*.sha256
            
















































